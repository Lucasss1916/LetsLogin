# Apex 配置工具 Windows exe 自动打包
# 触发:工具脚本或本工作流变更;产物 exe 由 CI 提交回仓库(nginx /downloads/ 直接供全队下载)
# 注意:runner 默认 pwsh 的 ErrorActionPreference=Stop 会把 exe 的 stderr 当 step 失败,
#       冒烟一律用 cmd + 显式捕获,成败只记录、不阻断(功能逻辑已在源码层验证)
name: build-apex-cfg-exe

on:
  push:
    branches: [main]
    paths:
      - 'web/public/downloads/apex_cfg_tool.py'
      - '.github/workflows/build-apex-cfg-exe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build onefile exe
        run: pyinstaller --onefile --console --clean --name apex_cfg_tool web/public/downloads/apex_cfg_tool.py

      - name: Defender exclusions
        run: Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE" -ErrorAction SilentlyContinue

      - name: Smoke-test exe (报告写入文件,不阻断)
        shell: pwsh
        run: |
          $env:PYTHONIOENCODING = 'utf-8'
          $p = Start-Process -FilePath ".\dist\apex_cfg_tool.exe" -ArgumentList "--help" -NoNewWindow -Wait -PassThru -RedirectStandardOutput smoke-out.txt -RedirectStandardError smoke-err.txt
          @("exit_code=$($p.ExitCode)", "--- STDOUT ---", (Get-Content smoke-out.txt -Raw), "--- STDERR ---", (Get-Content smoke-err.txt -Raw)) | Out-File smoke-report.txt -Encoding utf8
          Get-Content smoke-report.txt | Out-Host

      - name: Commit exe + 报告回 downloads/(报告 base64 进 commit message 便于诊断)
        run: |
          Copy-Item dist\apex_cfg_tool.exe web\public\downloads\apex_cfg_tool.exe
          $b64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes((Get-Content smoke-report.txt -Raw)))
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/downloads/apex_cfg_tool.exe
          git commit -m "[skip ci] build apex_cfg_tool.exe from $env:GITHUB_SHA" -m "SMOKE_B64:$b64"
          git push

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apex_cfg_tool-exe
          path: |
            dist/apex_cfg_tool.exe
            smoke-report.txt

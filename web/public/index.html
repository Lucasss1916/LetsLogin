<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Let's Log !n // CYBER TERMINAL</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <!-- 赛博背景特效层 -->
  <div class="cyber-bg" aria-hidden="true">
    <div class="cyber-grid"></div>
    <div class="cyber-vignette"></div>
    <div class="cyber-scanlines"></div>
  </div>

  <!-- 登录视图 -->
  <main id="view-login" class="auth-view hidden">
    <form id="login-form" class="card auth-card">
      <div class="auth-brand-wrap">
        <div class="cyber-badge-top">[ SECURE TERMINAL ]</div>
        <h1>Let's Log !n</h1>
        <p class="muted">// 团队密码与密钥中枢</p>
      </div>
      <label><span class="label-txt">用户名</span><input id="login-username" autocomplete="username" required placeholder="USERNAME" /></label>
      <label><span class="label-txt">密码</span><input id="login-password" type="password" autocomplete="current-password" required placeholder="PASSWORD" /></label>
      <div id="login-error" class="error hidden"></div>
      <button class="primary" type="submit">ACCESS // 登录</button>
    </form>
  </main>

  <!-- 首次登录强制改密 -->
  <main id="view-change-pw" class="auth-view hidden">
    <form id="change-pw-form" class="card auth-card">
      <div class="auth-brand-wrap">
        <div class="cyber-badge-top">[ SECURITY NOTICE ]</div>
        <h2>重置访问密钥</h2>
        <p class="muted">// 首次登录或管理员重置后需修改密码</p>
      </div>
      <label><span class="label-txt">原密码</span><input id="cp-old" type="password" autocomplete="current-password" required placeholder="CURRENT KEY" /></label>
      <label><span class="label-txt">新密码(至少 8 位)</span><input id="cp-new" type="password" autocomplete="new-password" required placeholder="NEW ACCESS KEY" /></label>
      <div id="cp-error" class="error hidden"></div>
      <button class="primary" type="submit">UPDATE // 确认修改</button>
    </form>
  </main>

  <!-- 主应用 -->
  <main id="view-app" class="app hidden">
    <header class="topbar">
      <div class="brand-group">
        <span class="brand">Let's Log !n</span>
        <span class="cyber-badge-inline">ONLINE</span>
      </div>
      <div class="top-right">
        <span id="whoami" class="muted">…</span>
        <button id="btn-users" class="ghost hidden">用户管理</button>
        <button id="btn-back-accounts" class="ghost hidden">← 返回账号</button>
        <button id="btn-logout" class="ghost">退出</button>
      </div>
    </header>

    <section id="panel-accounts">
      <div class="panel-head">
        <h2>账号</h2>
        <button id="btn-new-account" class="primary">+ 新增账号</button>
      </div>
      <div id="account-list" class="account-list"></div>
    </section>

    <section id="panel-users" class="hidden">
      <div class="panel-head">
        <h2>用户管理</h2>
        <button id="btn-new-user" class="primary">+ 新增用户</button>
      </div>
      <table id="user-table" class="table"></table>
      <div id="user-placeholder" class="muted hidden"></div>
    </section>
  </main>

  <!-- 账号详情弹层 -->
  <div id="modal-account" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head">
        <h3 id="acc-title">账号</h3>
        <button class="ghost" data-close>✕</button>
      </div>
      <form id="account-form">
        <input type="hidden" id="acc-id" />
        <label><span class="label-txt">名称 *</span><input id="acc-name" required placeholder="如 Google / AWS" /></label>
        <label><span class="label-txt">平台</span><input id="acc-platform" placeholder="如 GitHub / Steam" /></label>
        <label><span class="label-txt">登录名 *</span><input id="acc-login" required placeholder="如 user@domain.com" /></label>
        <label><span class="label-txt">密码 (留空表示不修改)</span><input id="acc-password" type="password" /></label>
        <label><span class="label-txt">2FA Secret</span><input id="acc-totp" placeholder="Base32, 留空忽略" /></label>
        <label><span class="label-txt">备注</span><textarea id="acc-note" rows="2" placeholder="备注信息..."></textarea></label>
        <label><span class="label-txt">游戏与段位</span>
          <div id="acc-games"></div>
          <button type="button" class="ghost sm" id="btn-add-game">+ 添加游戏</button>
        </label>
        <label><span class="label-txt">可见性</span>
          <select id="acc-visibility">
            <option value="private">仅自己(私有)</option>
            <option value="all">全体成员</option>
            <option value="selected">指定成员</option>
          </select>
        </label>
        <label id="share-row" class="hidden"><span class="label-txt">共享给 (逗号分隔的用户ID)</span>
          <input id="acc-share" placeholder="如 2,3" />
        </label>
        <div id="acc-error" class="error hidden"></div>
        <div class="modal-actions">
          <button type="button" class="ghost danger" id="btn-delete-account" hidden>删除</button>
          <button type="submit" class="primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 账号查看(显示明文/动态码)弹层 -->
  <div id="modal-view" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head">
        <h3 id="view-title">账号</h3>
        <button class="ghost" data-close>✕</button>
      </div>
      <dl class="details">
        <dt>平台</dt><dd id="view-platform"></dd>
        <dt>登录名</dt><dd id="view-login"></dd>
        <dt>密码</dt>
        <dd>
          <span id="view-password" class="secret">••••••••</span>
          <button type="button" class="ghost sm" id="btn-reveal">显示</button>
          <button type="button" class="ghost sm" id="btn-copy-pw" title="复制密码">⧉</button>
        </dd>
        <dt>2FA 动态码</dt>
        <dd>
          <span id="view-totp" class="totp">—</span>
          <span id="view-remaining" class="muted"></span>
          <button type="button" class="ghost sm" id="btn-copy-totp" title="复制动态码">⧉</button>
        </dd>
        <dt>备注</dt><dd id="view-note"></dd>
        <dt>游戏 / 段位</dt><dd id="view-games" class="acc-games"></dd>
      </dl>
      <div id="session-area">
        <label id="session-game-row" class="hidden"><span class="label-txt">上号游戏</span>
          <select id="session-game"></select>
        </label>
        <div id="session-active" class="hidden">⏳ 已签出,正在进行占用</div>
        <button type="button" class="primary" id="btn-session-start">签出(开始占用)</button>
        <button type="button" class="ghost danger hidden" id="btn-session-end">签入(结束占用)</button>
        <button type="button" class="danger hidden" id="btn-force-end">管理员强制签入</button>
      </div>
      <div id="view-error" class="error hidden"></div>
    </div>
  </div>

  <!-- 用户表单弹层 -->
  <div id="modal-user" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head">
        <h3 id="user-title">用户</h3>
        <button class="ghost" data-close>✕</button>
      </div>
      <form id="user-form">
        <input type="hidden" id="u-id" />
        <label id="u-username-row"><span class="label-txt">用户名 *</span><input id="u-username" required /></label>
        <label><span class="label-txt">密码 (创建或重置, 至少 8 位)</span><input id="u-password" type="password" /></label>
        <label><span class="label-txt">角色</span>
          <select id="u-role"><option value="user">普通用户</option><option value="admin">管理员</option></select>
        </label>
        <div id="u-error" class="error hidden"></div>
        <div class="modal-actions">
          <button type="button" class="ghost danger" id="btn-disable-user" hidden>禁用/启用</button>
          <button type="submit" class="primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="/app.js"></script>
</body>
</html>
